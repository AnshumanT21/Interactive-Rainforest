<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Uma’s Rainforest</title>
  <meta name="description" content="A flight through the rainforest canopy, from bird to bird. Made for Uma." />
  <meta name="theme-color" content="#0b1a13" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f6f3ea;
      --ink-dim: rgba(246, 243, 234, 0.72);
      --ink-faint: rgba(246, 243, 234, 0.45);
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Inter', system-ui, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #0b1a13; color: var(--ink); }
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-stopped { overflow: hidden; }
    body { font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    #webgl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; outline: none; }
    #track { height: 2600vh; }

    .ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }

    /* title */
    .title {
      position: absolute; inset: 0; margin: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; opacity: 0; visibility: hidden; will-change: opacity, filter, transform;
      text-shadow: 0 2px 40px rgba(6, 20, 14, 0.45);
    }
    .title__eyebrow {
      font-family: var(--sans); font-weight: 500; font-size: 12px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--ink-dim); margin-bottom: 18px;
    }
    .title__main {
      font-family: var(--serif); font-weight: 300; line-height: 0.9; letter-spacing: -0.02em;
      font-size: clamp(64px, 13vw, 220px);
    }
    .title__main em { font-style: italic; }

    .hint {
      position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
      font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #3b4d57;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .hint::after {
      content: ''; width: 1px; height: 42px; background: linear-gradient(#3b4d57, transparent);
      animation: hint 2.4s var(--ease-out) infinite;
      transform-origin: top;
    }
    @keyframes hint { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

    /* description cards */
    .card {
      position: absolute; top: 50%; width: min(440px, 36vw);
      transform: translateY(-50%);
      text-shadow: 0 1px 24px rgba(4, 14, 9, 0.6);
    }
    /* a soft dark pool behind the text so it reads over bright mist */
    .card::after {
      content: ''; position: absolute; z-index: -1; inset: -22% -30% -22% -40%;
      background: radial-gradient(closest-side, rgba(5, 16, 10, 0.55), rgba(5, 16, 10, 0.32) 55%, rgba(5, 16, 10, 0));
      opacity: 0; transition: opacity 1.1s var(--ease-out);
    }
    .card--right::after { inset: -22% -40% -22% -30%; }
    .card.is-active::after { opacity: 1; }
    .card--left { left: 6vw; }
    .card--right { right: 6vw; }
    .card > * {
      opacity: 0; filter: blur(8px); transform: translate3d(0, 18px, 0);
      transition: opacity 0.7s var(--ease-out), filter 0.7s var(--ease-out), transform 0.9s var(--ease-out);
    }
    .card.is-active > * { opacity: 1; filter: blur(0); transform: none; transition-duration: 1.1s, 1.1s, 1.3s; }
    .card.is-active > :nth-child(2) { transition-delay: 0.08s; }
    .card.is-active > :nth-child(3) { transition-delay: 0.16s; }
    .card.is-active > :nth-child(4) { transition-delay: 0.24s; }
    .card.is-active > :nth-child(5) { transition-delay: 0.32s; }
    .card__index { font-size: 11px; letter-spacing: 0.3em; color: var(--ink-faint); margin: 0 0 16px; }
    .card__name { font-family: var(--serif); font-weight: 300; font-size: clamp(44px, 5.4vw, 88px); line-height: 0.95; margin: 0; letter-spacing: -0.015em; }
    .card__latin { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--ink-dim); margin: 10px 0 22px; }
    .card__text { font-size: 15px; line-height: 1.6; color: var(--ink-dim); margin: 0 0 26px; max-width: 36ch; }
    .card__facts { display: grid; grid-template-columns: repeat(3, auto); gap: 18px 28px; margin: 0; justify-content: start; }
    .card__facts dt { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
    .card__facts dd { margin: 0; font-family: var(--serif); font-size: 19px; }

    .loader {
      position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 22px;
      background: #0b1a13; color: var(--ink-dim); transition: opacity 1.4s var(--ease-out);
    }
    .is-ready .loader { opacity: 0; pointer-events: none; }
    .loader__label { font-family: var(--serif); font-style: italic; font-size: 22px; letter-spacing: 0.01em; }
    .loader__track { width: 160px; height: 1px; background: rgba(246, 243, 234, 0.15); overflow: hidden; }
    .loader__bar { height: 100%; background: var(--ink-dim); transform: scaleX(0); transform-origin: left; transition: transform 0.4s var(--ease-out); }

    .fps { position: fixed; top: 10px; right: 10px; z-index: 10; font: 12px/1 ui-monospace, monospace; background: rgba(0,0,0,0.5); padding: 6px 8px; border-radius: 4px; }

    @media (max-width: 768px) {
      .card, .card--left, .card--right {
        top: auto; bottom: calc(28px + env(safe-area-inset-bottom)); left: 16px; right: 16px;
        width: auto; transform: none;
      }
      /* scrim so the card stays legible over bright mist */
      .card::before {
        content: ''; position: absolute; z-index: -1; left: -16px; right: -16px; top: -90px;
        bottom: calc(-28px - env(safe-area-inset-bottom));
        background: linear-gradient(rgba(5, 16, 10, 0), rgba(5, 16, 10, 0.62) 45%);
        opacity: 0; transition: opacity 0.9s var(--ease-out);
      }
      .card.is-active::before { opacity: 1; }
      .card__name { font-size: 44px; }
      .card__latin { font-size: 17px; margin: 6px 0 12px; }
      .card__text { font-size: 14px; margin-bottom: 16px; }
      .card__facts { gap: 10px 18px; }
      .card__facts dd { font-size: 16px; }
      .title__eyebrow { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card > *, .card.is-active > * { transition-duration: 0.4s; transform: none; filter: none; }
      .hint::after { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="webgl" aria-hidden="true"></canvas>
  <div class="ui">
    <h1 class="title">
      <span class="title__eyebrow">A journey through the canopy</span>
      <span class="title__main">Uma’s <em>Rainforest</em></span>
    </h1>
    <div class="hint">Scroll</div>
    <div id="cards"></div>
  </div>
  <div class="loader" role="status">
    <span class="loader__label">Growing the rainforest…</span>
    <div class="loader__track"><div class="loader__bar"></div></div>
  </div>
  <div id="track"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
